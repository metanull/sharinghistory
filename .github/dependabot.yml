# Daily checks on third-party dependencies, each waiting out a 7-day cooldown
# so a release has time to be withdrawn before it reaches a site.
version: 2
updates:
  # The @museumwnf platform packages (viewer-core, viewer-layout, viewer-i18n)
  # and the site's own data package are IGNORED here, and that is no longer
  # because Dependabot cannot reach them — they publish publicly to npmjs now,
  # which Dependabot can read without a token like any other dependency.
  #
  # They are ignored because they are updated deliberately, not opportunistically:
  # a platform release is propagated to every consumer site as one PR right
  # after the release, by `tools/propagate.mjs` in viewer-workflows. A
  # Dependabot bump landing on its own schedule would race that procedure —
  # updating this site out of step with the others, and possibly before a
  # release has finished its own rollout — so it stays out of Dependabot's
  # hands until that procedure itself is retired.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@museumwnf/*"

  # The reusable workflows in museumwithnofrontiers/viewer-workflows are pinned to an exact
  # version in .github/workflows/*.yml, never to a moving major tag. Dependabot
  # covers reusable-workflow refs as well as step-level actions, so a new
  # viewer-workflows release arrives here as a pull request that runs this
  # site's own CI before it is adopted — instead of a force-moved `v1`
  # deploying untested CI to every repo at once. Green minor/patch bumps
  # auto-merge via automerge.yml; majors wait for a human.
  #
  # This ecosystem is unaffected by the problem above: it resolves against the
  # GitHub API, not against npm.pkg.github.com.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
